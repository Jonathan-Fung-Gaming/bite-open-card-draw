name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      migration_only: ${{ steps.classify.outputs.migration_only }}
      migration_changed: ${{ steps.classify.outputs.migration_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/migration-scope.mjs
  quality-gates:
    name: Quality Gates
    needs: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Migration-only exemption
        if: needs.classify-changes.outputs.migration_only == 'true'
        run: echo 'Only the new migration is tested for this change.'
      - uses: actions/setup-node@v4
        if: needs.classify-changes.outputs.migration_only != 'true'
        with:
          node-version: 22
          cache: npm
      - if: needs.classify-changes.outputs.migration_only != 'true'
        run: npm ci
      - if: needs.classify-changes.outputs.migration_only != 'true'
        run: npm run lint
      - if: needs.classify-changes.outputs.migration_only != 'true'
        run: npm run typecheck
      - if: needs.classify-changes.outputs.migration_only != 'true'
        run: npm run test
      - if: needs.classify-changes.outputs.migration_only != 'true'
        run: npm run build
  migration-tests:
    name: New Migration Tests
    needs: classify-changes
    if: needs.classify-changes.outputs.migration_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: migration_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test only changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:migration-test-only@127.0.0.1:5432/migration_test
        run: node scripts/test-changed-migrations.mjs
